[project]
name = "pipeline_v1"
version = "0.1.0"
description = "Panel-wise manga colorization pipeline (YOLO26n + OpenRouter gemma + FLUX.2 Klein 9B LoRA)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: real-network integration test (no mocks: real OpenRouter gemma detection, real FLUX colorize on Spark, real gpt-5.6-luna validation, real YOLO). Inputs are committed in tests/data/; artifacts and measured costs land in tests/output/YYYYMMDD-HHMMSS/. Skipped unless explicitly run with -m integration.",
]
